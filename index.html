<!DOCTYPE HTML>
<html>
  <head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <title>AC Medias</title>
    <style>
      body {
        background-color: #000000;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <button style="width: 30px; height: 30px; background: transparent; border: none;">
      <span class="material-symbols-outlined" style="color: #ffffff;" theme="dark">brightness_4</span>
    </button>
    <script>
      const span = document.querySelector('button').children[0]

      span.parentElement.addEventListener("click", () => {
        if (span.getAttribute("theme") === "dark") {
          span.setAttribute("theme", "light")
          span.textContent = "brightness_5"
          document.body.style.backgroundColor = "#ffffff";
          span.style.color = "#000000";
        } else {
          span.setAttribute("theme", "dark")
          span.textContent = "brightness_4"
          document.body.style.backgroundColor = "#000000";
          span.style.color = "#ffffff";
        }
      });
    </script>
  </body>
</html>
